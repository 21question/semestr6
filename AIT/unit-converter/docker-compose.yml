version: '3.9'

services:

  app:
    build: .
    container_name: unit_converter
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

      - ./certbot/conf:/etc/letsencrypt

      - ./certbot/www:/var/www/certbot

    depends_on:
      - app